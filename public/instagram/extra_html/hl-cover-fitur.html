<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF9F5;
      background-image: radial-gradient(#C8C7C2 2px, transparent 2px);
      background-size: 28px 28px;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .portrait {
      width: 1080px;
      height: 1350px;
      padding: 72px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .story-canvas {
      width: 1080px;
      height: 1920px;
      padding: 96px 72px 88px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 3.5px solid #000000;
      padding-bottom: 24px;
    }
    .badge {
      background: #FFE066;
      border: 3.5px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
      padding: 8px 20px;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge-green {
      background: #bbf7d0;
      border: 3.5px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
      padding: 8px 20px;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge-blue {
      background: #bfdbfe;
      border: 3.5px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
      padding: 8px 20px;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .meta-tag {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #000000;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-top: 3.5px solid #000000;
      padding-top: 24px;
    }
    .handle-tag {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .page-tag {
      background: #FFFFFF;
      border: 2px solid #000000;
      box-shadow: 3px 3px 0px 0px #000000;
      padding: 6px 14px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
    }
    .card-neo {
      background: #FFFFFF;
      border: 5px solid #000000;
      box-shadow: 12px 12px 0px 0px #000000;
      padding: 44px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card-neo-yellow {
      background: #FFE066;
      border: 5px solid #000000;
      box-shadow: 12px 12px 0px 0px #000000;
      padding: 44px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .h-portrait {
      font-size: 52px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .h-story {
      font-size: 58px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .lead-text {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.45;
      color: #222222;
      margin-top: 10px;
    }
    .demo-box {
      background: #FAF9F5;
      border: 3.5px solid #000000;
      box-shadow: 5px 5px 0px 0px #000000;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .demo-label {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666666;
    }
    .demo-code {
      font-family: monospace;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .result-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .res-pill {
      border: 2px solid #000000;
      padding: 5px 12px;
      font-weight: 900;
      font-size: 15px;
    }
    .btn-cta {
      background: #FFE066;
      border: 4.5px solid #000000;
      box-shadow: 7px 7px 0px 0px #000000;
      padding: 20px 28px;
      font-size: 21px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 8px;
    }
    .list-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .list-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.4;
    }
    .bullet-sq {
      width: 14px;
      height: 14px;
      background: #000000;
      margin-top: 8px;
      flex-shrink: 0;
    }
    
        .hl-center {
          margin: auto;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 600px;
          height: 600px;
          background: #FFE066;
          border: 12px solid #000000;
          border-radius: 50%;
          box-shadow: 16px 16px 0px 0px #000000;
          text-align: center;
          padding: 36px 40px;
        }
        .hl-icon-badge {
          width: 140px;
          height: 140px;
          background: #FFFFFF;
          border: 5px solid #000000;
          border-radius: 28px;
          box-shadow: 7px 7px 0px 0px #000000;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 18px;
        }
        .hl-title {
          font-size: 34px;
          font-weight: 900;
          text-transform: uppercase;
          line-height: 1.12;
          letter-spacing: 0.03em;
          color: #000000;
        }
        .hl-sub {
          font-size: 13px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.16em;
          color: #000000;
          margin-top: 10px;
          opacity: 0.9;
        }
