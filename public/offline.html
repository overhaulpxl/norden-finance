<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFE066" />
  <title>Offline | Norden Finance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF9F5;
      background-image: radial-gradient(#d1d1d1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: #fff;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px #000;
      max-width: 420px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #FFE066;
      border: 2px solid #000;
      box-shadow: 2px 2px 0px #000;
      padding: 0.25rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 1.5px solid #000;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #000;
      color: #fff;
      border: 2px solid #000;
      box-shadow: 3px 3px 0px #000;
      padding: 0.85rem 1.25rem;
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      Mode Luar Jaringan (Offline)
    </div>
    <h1>Koneksi Terputus</h1>
    <p>
      Norden Finance tidak dapat terhubung ke internet saat ini. Periksa koneksi data seluler atau Wi-Fi perangkat Anda, lalu coba muat ulang halaman.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Muat Ulang Halaman
    </button>
  </div>
</body>
</html>
