name: CI

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_APP_URL: https://norden.app
      SHORTCUT_TOKEN_SECRET: ci-test-shortcut-token-secret-at-least-32-chars-long
      CRON_SECRET: ci-test-cron-secret-at-least-32-chars-long
      FIREBASE_PROJECT_ID: norden-test
      FIREBASE_CLIENT_EMAIL: test@norden-test.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC5\n-----END PRIVATE KEY-----"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate & generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build Next.js app
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle
